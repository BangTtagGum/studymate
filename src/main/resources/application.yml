spring:
  application:
    name: study-buddy

server:
  port: 8080

study-buddy:
  github:
    owner: ${GITHUB_OWNER}
    repo: ${GITHUB_REPO}
    branch: ${GITHUB_BRANCH:main}
    token: ${GITHUB_TOKEN}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    bot-name: study-buddy
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
  study:
    notes-dir: notes
    questions-dir: questions
    reviews-dir: reviews
    question-count: 4

logging:
  level:
    io.studybuddy: INFO
