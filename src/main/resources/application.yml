spring:
  application:
    name: studymate
  task:
    execution:
      # 웹훅 처리를 한 스레드로 직렬화해 같은 파일을 동시에 커밋하는 충돌을 막는다
      pool:
        core-size: 1
        max-size: 1
        queue-capacity: 100
      thread-name-prefix: webhook-

server:
  port: ${PORT:8080}

studymate:
  github:
    owner: ${GITHUB_OWNER}
    repo: ${GITHUB_REPO}
    branch: ${GITHUB_BRANCH:main}
    token: ${GITHUB_TOKEN}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    bot-name: studymate
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
  study:
    notes-dir: notes
    questions-dir: questions
    reviews-dir: reviews
    question-count: 4

logging:
  level:
    io.studymate: INFO
